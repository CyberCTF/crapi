# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP crAPI, completely ridiculous API (by the OWASP crAPI contributors) as an Isoloom spec:
# every service builds from the upstream source (OWASP/crAPI, vendored unchanged: the services in
# build/<machine>/app/, the rest in app/) with the environment of upstream's docker-compose.yml
# baked in. The LLM chatbot is left out (it needs an OpenAI key and internet access).
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: crapi

# Given by the CyberCTF launcher: this player's flags, one per challenge that has a secret to
# capture. Without them the development flags.
inputs:
  CTF_FLAG_MAIN: {}
  CTF_FLAG_VEHICLE_LOCATION: {}
  CTF_FLAG_MECHANIC_REPORT: {}
  CTF_FLAG_PASSWORD_RESET: {}
  CTF_FLAG_NOSQL_COUPON: {}
  CTF_FLAG_SQL_COUPON: {}
  CTF_FLAG_UNAUTH_ORDER: {}
networks:
  lab: {cidr: 10.60.6.0/24, internet: false}

machines:
  postgresdb:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {data: /var/lib/postgresql/data}
    ports:
      postgres:
        port: 5432
    app:
      build: build/postgresdb
  mongodb:
    networks: {lab: 21}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {data: /data/db}
    ports:
      mongodb:
        port: 27017
    app:
      build: build/mongodb
  mailhog:
    networks: {lab: 22}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [mongodb]
    ports:
      smtp:
        port: 1025
      mail-ui:
        port: 8025
        protocol: http
        publish: true
    app:
      build: build/mailhog
  gateway-service:
    networks: {lab: 23}
    resources: {cpus: 1, memory_mb: 256}
    ports:
      https:
        port: 443
    app:
      build: build/gateway-service
  crapi-identity:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 384}
    depends_on: [postgresdb, mongodb, mailhog]
    ports:
      identity:
        port: 8080
        protocol: http
    app:
      build: build/crapi-identity
  crapi-community:
    networks: {lab: 12}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [postgresdb, mongodb, crapi-identity]
    ports:
      community:
        port: 8087
        protocol: http
    app:
      build: build/crapi-community
  crapi-workshop:
    networks: {lab: 13}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [postgresdb, mongodb, crapi-identity, crapi-community]
    ports:
      workshop:
        port: 8000
        protocol: http
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
      - path: /run/lab/ctf_flag_vehicle_location
        input: CTF_FLAG_VEHICLE_LOCATION
      - path: /run/lab/ctf_flag_mechanic_report
        input: CTF_FLAG_MECHANIC_REPORT
      - path: /run/lab/ctf_flag_password_reset
        input: CTF_FLAG_PASSWORD_RESET
      - path: /run/lab/ctf_flag_nosql_coupon
        input: CTF_FLAG_NOSQL_COUPON
      - path: /run/lab/ctf_flag_sql_coupon
        input: CTF_FLAG_SQL_COUPON
      - path: /run/lab/ctf_flag_unauth_order
        input: CTF_FLAG_UNAUTH_ORDER
    setup:
      - ctf/flag.sh
    app:
      build: build/crapi-workshop
  crapi-web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    depends_on: [crapi-identity, crapi-community, crapi-workshop, mailhog]
    ports:
      web:
        port: 80
        protocol: http
        publish: true
      https:
        port: 443
        publish: true
    app:
      build: build/crapi-web
checks:
  - name: crAPI answers
    http: http://crapi-web/
    wait: 300
  - name: the identity service is healthy
    http: http://crapi-identity:8080/identity/health_check
    wait: 120
  - name: the community service answers
    http: http://crapi-community:8087/community/home
    wait: 120
  - name: the workshop service is healthy
    http: http://crapi-workshop:8000/workshop/health_check/
    wait: 180
  - name: a seeded user logs in and reads its dashboard
    script: checks/login.sh
    wait: 120
  - name: MailHog answers
    http: http://mailhog:8025/
  - name: the payment gateway answers
    tcp: gateway-service:443

message: |
  crAPI answers at {{ machines.crapi-web.ports.web.url }} (HTTPS on
  {{ machines.crapi-web.ports.https.published }}). Sign up with an @example.com address; the mails
  (OTPs, vehicle details) arrive in MailHog at {{ machines.mailhog.ports.mail-ui.url }}.
  The challenges are listed in app/docs/challenges.md (the chatbot ones are left out).
