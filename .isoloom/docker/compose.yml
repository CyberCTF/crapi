name: crapi
services:
  postgresdb:
    build:
      context: ../../build/postgresdb
    image: isoloom/crapi-postgresdb
    platform: linux/amd64
    hostname: postgresdb
    networks:
      lab:
        ipv4_address: 10.60.6.20
    volumes:
    - postgresdb-data:/var/lib/postgresql/data
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 5432
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
      isoloom.service.postgres: tcp:5432
    restart: unless-stopped
  postgresdb-routes:
    image: alpine:3.20
    network_mode: service:postgresdb
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgresdb:
        condition: service_started
    restart: unless-stopped
  mongodb:
