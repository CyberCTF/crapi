apiVersion: batch/v1
kind: Job
metadata:
  name: isoloom-check
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        net.isoloom.com/lab: member
        isoloom.com/check: isoloom-check
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - /isoloom/run/networks.sh
        volumeMounts:
        - name: runner
          mountPath: /isoloom/run
        - name: scripts
          mountPath: /isoloom/scripts
      volumes:
      - name: runner
        configMap:
          name: isoloom-check-runners
          defaultMode: 493
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
